apiVersion: v1
kind: ConfigMap
metadata:
  name: telco-supervisor-config
data:
  config.json: |
    {
      "interval_seconds": 5,
      "timeout_seconds": 3,
      "services": [
        {
          "name": "packet-core",
          "url": "http://packet-core:8080/index.html"
        },
        {
          "name": "vrouter",
          "url": "http://vrouter:8080/index.html"
        },
        {
          "name": "dns",
          "url": "http://dns:8080/index.html"
        }
      ]
    }
